<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="100%" height="100%">
  <defs>
    <linearGradient id="burgundyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4B2634"/>
      <stop offset="100%" stop-color="#351A24"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2C889"/>
      <stop offset="50%" stop-color="#C5A059"/>
      <stop offset="100%" stop-color="#9C7733"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#351A24" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Geometric Emblem: Stylized 'G' & Growth Chart -->
  <g transform="translate(15, 15)" filter="url(#shadow)">
    <!-- Outer Shield / Diamond -->
    <rect x="0" y="0" width="90" height="90" rx="20" fill="url(#burgundyGrad)"/>
    
    <!-- Accent Line -->
    <path d="M18 68 L36 46 L52 56 L72 26" fill="none" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Upward Arrowhead -->
    <path d="M60 26 L72 26 L72 38" fill="none" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Pulse Node -->
    <circle cx="72" cy="26" r="4.5" fill="#FFFDF9"/>
    <circle cx="36" cy="46" r="3.5" fill="url(#goldGrad)"/>
    <circle cx="52" cy="56" r="3.5" fill="url(#goldGrad)"/>
  </g>

  <!-- Typography: GrowthIQ -->
  <text x="125" y="65" font-family="'Cinzel', 'Playfair Display', 'Georgia', serif" font-size="44" font-weight="700" fill="#4B2634" letter-spacing="1.5">
    Growth<tspan fill="url(#goldGrad)">IQ</tspan>
  </text>
  
  <!-- Sub-caption -->
  <text x="128" y="90" font-family="'Inter', 'Helvetica Neue', sans-serif" font-size="12" font-weight="600" fill="#8C7A6B" letter-spacing="3.2">
    E-COMMERCE MARKETING INTELLIGENCE
  </text>
</svg>

